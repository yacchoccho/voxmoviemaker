name: Rust quality and licenses
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Rust development tools
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable check --locked
      - run: cargo +stable clippy --all-targets -- -D warnings
      - run: cargo +stable test --locked
      - name: Prepare development-only license checker
        run: cargo +stable install --locked --version 0.20.2 cargo-deny
      - run: cargo +stable deny check licenses
      - name: Real FFmpeg tests when tools are already available
        shell: bash
        run: |
          if command -v ffmpeg && command -v ffprobe; then
            cargo +stable test --locked --test ffmpeg_integration -- --ignored --test-threads=1
            cargo +stable test --locked --test playback real_proxy_streams -- --ignored
            cargo +stable test --locked --test playback real_proxy_cancellation -- --ignored
            cargo +stable test --locked --test phase5 actual_ -- --ignored --test-threads=1
          else
            echo 'Real FFmpeg tests were not run: externally installed tools are unavailable.'
          fi
# FFmpeg/ffprobe/VOICEVOX are never downloaded, installed, or started by this workflow.
