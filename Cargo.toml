[package]
name = "voxmoviemaker"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "A lightweight Linux timeline editor using external FFmpeg and VOICEVOX"
publish = false
default-run = "voxmoviemaker"

[dependencies]
eframe = { version = "=0.33.2", default-features = false, features = ["glow", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["json"] }
fluent-bundle = "0.16"
unic-langid = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
hound = "3.5"
# Reuse the already-audited dependency for Linux child process lifetime control.
libc = "0.2"
# Already present in the audited egui dependency graph; system-font text rasterization.
ab_glyph = "=0.2.32"
# Read-only PSD integration; test generators and optional serde support are unnecessary.
apeireth-image-psd = { version = "=2.0.0-rc.5", default-features = false }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

# Keep development builds practical on machines with limited disk/RAM.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
